{% extends "base.html" %}

{% block content %}
  <div class="login-container">
    <h1>{% if object %} Edit Profile {% else %} Create Your Profile {% endif %}</h1>
    
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      
      <!-- Display form fields here -->
      {{ form.as_p }}
      
      <!-- Password field (only show if editing an existing profile) -->
      {% if object %}
        <label for="password">New Password (leave blank if not changing):</label>
        <input type="password" name="password" id="password">
      {% endif %}
      
      <!-- Submit button styled as per the CSS -->
      <input type="submit" value="Submit">
    </form>
  </div>

  <script>
    let selectEl = document.getElementById('id_type');
    M.FormSelect.init(selectEl);

    let selectEl2 = document.getElementById('id_gender');
    M.FormSelect.init(selectEl2);
  </script>
{% endblock %}
