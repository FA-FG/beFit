{% extends 'base.html' %} 
{% block content %}

<h1>Gym List</h1>

{% for gym in gyms %}
<div class="card">
  <a href="{% url 'detail' gym.id %}">
    <div class="card-content">
      <span class="card-title">{{ gym.gym }}</span>
      
      <p><span>Location:</span> <span class="info">{{ gym.location }}</span></p>
      <p><span>Description:</span> <span class="info">{{ gym.description }}</span></p>
      <p><span>Phone Number:</span> <span class="info">{{ gym.phoneNumber }}</span></p>

    </div>
  </a>
</div>
{% endfor %}

{% endblock %}
